<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1100 618"
  width="1100"
  height="618"
  font-family="Arial, Helvetica, sans-serif"
>
  <rect x="0" y="0" width="1100" height="618.8" fill="#19191f" />
  <!-- date at top right -->
  <rect x="979.1" y="30.2" width="72.5" height="6.8" fill="#6e6e78" />
  <!-- title and one-line subtitle, left-aligned just below the middle -->
  <text
    x="136.7"
    y="314.3"
    font-size="34.8"
    font-weight="700"
    fill="#ffffff"
    text-anchor="start"
  >
    Title
  </text>
  <rect x="136.7" y="342.2" width="511.5" height="13.6" fill="#8c8c96" />
  <!-- footer -->
  <rect x="64.2" y="579.5" width="176.8" height="6" fill="#6e6e78" />
  <!-- logo -->
  <rect
    x="974.6"
    y="572.7"
    width="86.9"
    height="15.1"
    fill="none"
    stroke="#8a8f99"
    stroke-width="1"
  />
  <text
    x="1017.7"
    y="584"
    font-size="9.1"
    font-weight="400"
    fill="#8a8f99"
    text-anchor="middle"
  >
    Logo
  </text>
</svg>
